version: "3.8"

services:
  awm-relayer:
    image: avaplatform/awm-relayer:v1.3.1
    container_name: defi-trail-icm-relayer
    restart: unless-stopped
    ports:
      - "${RELAYER_METRICS_PORT:-8080}:8080"
    environment:
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - LOG_LEVEL=${RELAYER_LOG_LEVEL:-info}
    volumes:
      - ./config/relayer-config.json:/app/relayer-config.json:ro
    command:
      - "--config-file=/app/relayer-config.json"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

